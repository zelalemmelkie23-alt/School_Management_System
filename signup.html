<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | School Management</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%); color: #0f172a; }
        .topbar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; color: #f8fafc; padding: 18px 70px; }
        .logo { font-size: 1.6rem; font-weight: 700; }
        nav { display: flex; gap: 26px; }
        nav a { color: #f8fafc; text-decoration: none; font-weight: 600; }
        .page { min-height: calc(100vh - 130px); display: grid; place-items: center; padding: 40px 20px; }
        .signup-box { width: min(100%, 520px); background: #ffffff; border-radius: 20px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12); padding: 32px 28px; border: 1px solid #dcfce7; }
        .signup-box h2 { margin: 0 0 8px; text-align: center; color: #166534; font-size: 2rem; }
        .signup-box p { text-align: center; margin: 0 0 24px; color: #475569; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { margin-bottom: 18px; }
        .full-width { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 7px; font-weight: 600; color: #334155; }
        input, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.12); }
        .signup-btn { width: 100%; padding: 13px 18px; border: none; border-radius: 10px; background: #16a34a; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s ease; }
        .signup-btn:hover { background: #15803d; }
        .help-text { margin-top: 18px; text-align: center; color: #475569; font-size: 0.92rem; }
        .help-text a { color: #166534; font-weight: 700; }
        .error-message { display: none; background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; font-weight: 700; }
        .error-message.visible { display: block; }
        footer { background: #0f172a; color: #e2e8f0; text-align: center; padding: 18px 20px; }
        @media (max-width: 600px) { .topbar { flex-wrap: wrap; justify-content: center; gap: 12px; padding: 16px 20px; } nav { flex-wrap: wrap; justify-content: center; } .form-grid { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">NIBRETE BUZUNEH SECONDARY AND PREPARATORY SCHOOL</div>
        <nav>
            <a href="indx.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>
    </header>

    <main class="page">
        <div class="signup-box">
            <h2>Create Account</h2>
            <p>Register a new student, teacher, or admin.</p>
            <div id="signupError" class="error-message"></div>

            <form id="signupForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose username" required>
                    </div>

                    <div class="field full-width">
                        <label for="role">Role</label>
                        <select id="role" name="role">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="field full-width">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter email address" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create password" required>
                    </div>

                    <div class="field">
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" name="confirm" placeholder="Repeat password" required>
                    </div>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="help-text">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </main>

    <footer>
        NIBRETE BUZUNEH SECONDARY AND PREPARATORY SCHOOL © 2026
    </footer>

    <script src="app.js"></script>
    <script>
        const signupForm = document.getElementById('signupForm');
        const signupError = document.getElementById('signupError');

        signupForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const fullName = document.getElementById('fullname').value.trim();
            const username = document.getElementById('username').value.trim();
            const role = document.getElementById('role').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm').value;

            if (password !== confirmPassword) {
                signupError.textContent = 'Passwords do not match.';
                signupError.classList.add('visible');
                return;
            }

            const result = await SchoolApp.signupUser({ fullName, username, email, password, role });
            if (!result.success) {
                signupError.textContent = result.message;
                signupError.classList.add('visible');
                return;
            }

            if (role === 'admin') {
                window.location.href = 'dashboard.html';
            } else if (role === 'teacher') {
                window.location.href = 'teacher-portal.html';
            } else {
                window.location.href = 'student-portal.html';
            }
        });
    </script>
</body>
</html>
