<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | School Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0; font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #ecfeff 100%);
            color: #0f172a;
        }
        .topbar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; color: #f8fafc; padding: 18px 70px; }
        .logo { font-size: 1.6rem; font-weight: 700; }
        nav { display: flex; gap: 26px; }
        nav a { color: #f8fafc; text-decoration: none; font-weight: 600; }
        .page { min-height: calc(100vh - 130px); display: grid; place-items: center; padding: 40px 20px; }
        .login-box { width: min(100%, 430px); background: #ffffff; border-radius: 20px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12); padding: 32px 28px; border: 1px solid #dbeafe; }
        .login-box h2 { margin: 0 0 8px; text-align: center; color: #166534; font-size: 2rem; }
        .login-box p { text-align: center; margin: 0 0 24px; color: #475569; font-size: 0.98rem; }
        .field { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-weight: 600; color: #334155; }
        input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 1rem; outline: none; }
        input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.12); }
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 22px; color: #475569; font-size: 0.95rem; }
        .checkbox-row input { width: auto; margin: 0; }
        .login-btn { width: 100%; padding: 13px 18px; border: none; border-radius: 10px; background: #16a34a; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s ease; }
        .login-btn:hover { background: #15803d; }
        .help-text { margin-top: 18px; text-align: center; color: #475569; font-size: 0.92rem; }
        .help-text a { color: #166534; font-weight: 700; text-decoration: none; }
        .error-message { display: none; background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; font-weight: 700; }
        .error-message.visible { display: block; }
        footer { background: #0f172a; color: #e2e8f0; text-align: center; padding: 18px 20px; }
        @media (max-width: 600px) { .topbar { flex-wrap: wrap; justify-content: center; gap: 12px; padding: 16px 20px; } nav { flex-wrap: wrap; justify-content: center; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">Green Valley Academy</div>
        <nav>
            <a href="indx.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>
    </header>

    <main class="page">
        <div class="login-box">
            <h2>Login</h2>
            <p>Welcome back! Access your school dashboard.</p>
            <div id="loginError" class="error-message"></div>

            <form id="loginForm">
                <div class="field">
                    <label for="identifier">Username or Email</label>
                    <input type="text" id="identifier" name="identifier" placeholder="Enter username or email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="help-text">
                Need an account? <a href="signup.html">Create one</a>
            </div>
        </div>
    </main>

    <footer>
        Green Valley Academy © 2026
    </footer>

    <script src="app.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            const result = await SchoolApp.loginUser(identifier, password);
            if (!result.success) {
                loginError.textContent = result.message;
                loginError.classList.add('visible');
                return;
            }

            const user = result.user;
            if (user.role === 'admin') {
                window.location.href = 'dashboard.html';
            } else if (user.role === 'teacher') {
                window.location.href = 'teacher-portal.html';
            } else {
                window.location.href = 'student-portal.html';
            }
        });
    </script>
</body>
</html>
