<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Tracking | School Management</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        a { text-decoration: none; color: inherit; }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f172a; color: white; padding: 18px 60px;
        }
        .logo { font-size: 1.6rem; font-weight: 700; }
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { color: #e2e8f0; font-weight: 600; }
        .page { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }
        .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; }
        .panel {
            background: white; border: 1px solid #e2e8f0; border-radius: 18px;
            padding: 24px; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
        }
        .panel h2 { margin-top: 0; }
        .form-grid { display: grid; gap: 16px; }
        .field { display: grid; gap: 8px; }
        label { font-weight: 700; color: #334155; }
        input, select, button {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            border: 1px solid #cbd5e1; font-size: 1rem;
        }
        input:focus, select:focus { border-color: #16a34a; outline: none; }
        button {
            background: #16a34a; color: white; border: none; cursor: pointer; font-weight: 700;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 18px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #e2e8f0; }
        th { color: #475569; font-size: 0.75rem; text-transform: uppercase; }
        .status-pill {
            display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
        }
        .present { background: #dcfce7; color: #166534; }
        .absent { background: #fee2e2; color: #991b1b; }
        .late { background: #fef3c7; color: #92400e; }
        .message {
            display: none; margin-top: 14px; font-weight: 700; padding: 10px 12px; border-radius: 10px;
        }
        .message.success { display: block; background: #dcfce7; color: #166534; }
        @media (max-width: 820px) {
            .topbar { flex-wrap: wrap; padding: 18px 20px; }
            nav { flex-wrap: wrap; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">Green Valley Academy</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="fees.html">Fees</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="page">
        <div class="grid">
            <section class="panel">
                <h2>Mark Attendance</h2>
                <form id="attendanceForm" class="form-grid">
                    <div class="field">
                        <label for="studentSelect">Student</label>
                        <select id="studentSelect" required></select>
                    </div>
                    <div class="field">
                        <label for="attendanceDate">Date</label>
                        <input id="attendanceDate" type="date" required />
                    </div>
                    <div class="field">
                        <label for="attendanceStatus">Status</label>
                        <select id="attendanceStatus">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Late">Late</option>
                        </select>
                    </div>
                    <button type="submit">Save Attendance</button>
                    <div id="attendanceMessage" class="message"></div>
                </form>
            </section>

            <section class="panel">
                <h2>Attendance Record</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody"></tbody>
                </table>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
    const attendanceForm = document.getElementById('attendanceForm');
    const attendanceTableBody = document.getElementById('attendanceTableBody');
    const studentSelect = document.getElementById('studentSelect');
    const statusSelect = document.getElementById('attendanceStatus');
    const attendanceDate = document.getElementById('attendanceDate');
    const attendanceMessage = document.getElementById('attendanceMessage');

    // Load students into the dropdown
    async function loadStudents() {
        const students = await SchoolApp.getStudents();

        if (!students || students.length === 0) {
            studentSelect.innerHTML = `
                <option value="">No students found</option>
            `;
            return;
        }

        studentSelect.innerHTML = `
            <option value="">Select a student</option>
            ${students.map(student => `
                <option value="${student.studentId}">
                    ${student.firstName} ${student.lastName} (${student.studentId})
                </option>
            `).join('')}
        `;
    }

    // Display attendance records
    async function renderAttendance() {
        const records = await SchoolApp.getAttendance();

        if (!records || records.length === 0) {
            attendanceTableBody.innerHTML = `
                <tr>
                    <td colspan="3">No attendance records found.</td>
                </tr>
            `;
            return;
        }

        attendanceTableBody.innerHTML = records.slice().reverse().map(record => `
            <tr>
                <td>${record.studentName}</td>
                <td>${record.date}</td>
                <td>
                    <span class="status-pill ${record.status.toLowerCase()}">
                        ${record.status}
                    </span>
                </td>
            </tr>
        `).join('');
    }

    // Show success/error message
    function showMessage(text, type) {
        attendanceMessage.textContent = text;
        attendanceMessage.className = 'message ' + type;
    }

    // Save attendance
    attendanceForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        try {
            const studentId = studentSelect.value;

            if (!studentId) {
                showMessage('Please select a student.', 'error');
                return;
            }

            const students = await SchoolApp.getStudents();

            const student = students.find(
                item => item.studentId === studentId
            );

            if (!student) {
                showMessage('Please select a valid student.', 'error');
                return;
            }

            const record = {
                id: 'A-' + Date.now(),
                studentId: student.studentId,
                studentName: `${student.firstName} ${student.lastName}`,
                date: attendanceDate.value,
                status: statusSelect.value
            };

            await SchoolApp.addAttendance(record);

            await renderAttendance();

            showMessage(
                'Attendance saved successfully.',
                'success'
            );

            attendanceForm.reset();

            attendanceDate.value =
                new Date().toISOString().split('T')[0];

        } catch (error) {
            console.error(error);
            showMessage(error.message, 'error');
        }
    });

    // Set today's date
    attendanceDate.value =
        new Date().toISOString().split('T')[0];

    // Load page data
    Promise.all([
        loadStudents(),
        renderAttendance()
    ]).catch(error => {
        console.error(error);
        showMessage(error.message, 'error');
    });
</script>
</body>
</html>
